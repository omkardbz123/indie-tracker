name = "indie-tracker"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Pages and static files (admin dashboard, chat page, etc.) are served straight from /public.
[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "indie-tracker"
database_id = "d3779f40-9657-4fd9-8fd6-f67854ce8215"
migrations_dir = "migrations"

# Photo storage (R2) is not set up yet. Photo upload stays hidden until this is enabled:
#   npx wrangler r2 bucket create dog-photos
# then uncomment:
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "dog-photos"

# Set ACCESS_TEAM_DOMAIN and ACCESS_AUD as Worker secrets (see README).
