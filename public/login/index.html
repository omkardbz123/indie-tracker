<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg">
<title>Sign in · Dog ID</title>
<style>
:root{--text:#111827;--muted:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;background:#f7f7f8;color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
.card{max-width:400px;margin:15vh auto 0;background:#fff;border:1px solid var(--border);border-radius:10px;padding:32px 28px;text-align:center}
.mark{width:36px;height:36px;margin:0 auto 18px;border-radius:8px;background:var(--text);color:#fff;display:grid;place-items:center;font-weight:700}
h1{font-size:20px;margin:0 0 6px}
p{color:var(--muted);margin:0}
@media (max-width:440px){.card{margin:10vh 16px 0}}
</style>
</head>
<body>
<div class="card">
  <div class="mark">D</div>
  <h1 id="title">Signing you in…</h1>
  <p id="text">Please wait a moment.</p>
</div>
<script>
(function () {
  var token = location.hash.slice(1);
  // Keep the secret out of the address bar and browser history.
  history.replaceState(null, "", location.pathname + location.search);
  function show(title, text) {
    document.getElementById("title").textContent = title;
    document.getElementById("text").textContent = text;
  }
  if (!token) {
    if (new URLSearchParams(location.search).has("out")) {
      show("You've signed out", "Open your personal login link again to sign back in.");
    } else {
      show("Login link needed", "Open the personal login link an admin sent you. If you lost it, ask them for a new one.");
    }
    return;
  }
  fetch("/api/auth/login", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ token: token }),
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (data) {
      if (!r.ok) throw new Error(data.error || "Couldn't sign you in.");
      location.replace("/portal/");
    });
  }).catch(function (e) {
    show("This link doesn't work", e.message);
  });
})();
</script>
</body>
</html>
